name: GitHub Profile Views Counter CI
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  release:
    name: GitHub Profile Views Counter Action
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2.3.4
      - uses: actions/setup-node@v2.1.5
        with:
          node-version: 14.17.0
      - uses: gayanvoice/github-profile-views-counter-action@3.0.0
        env:
          INSIGHTS_TOKEN: ${{ secrets.INSIGHTS_TOKEN }}
      - name: Build shields JSON
        run: |
          VIEWS=$(grep -oE '>[0-9,]+<' svg/profile/badge.svg 2>/dev/null | head -1 | tr -d '><,' || true)
          VIEWS=${VIEWS:-0}
          UNIQUE=$(python3 -c "
          import json, glob
          total = 0
          for f in glob.glob('cache/*/summary.json'):
              try:
                  d = json.load(open(f))
                  total += d['summary']['uniques']
              except Exception:
                  pass
          print(total)
          ")
          echo "{\"schemaVersion\":1,\"label\":\"Profile views\",\"message\":\"$VIEWS\",\"color\":\"333333\"}" > views.json
          echo "{\"schemaVersion\":1,\"label\":\"Unique visitors\",\"message\":\"$UNIQUE\",\"color\":\"333333\"}" > unique.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add views.json unique.json
          git commit -m "update views.json and unique.json" || echo "nimic de comis"
          git push || echo "push esuat"
